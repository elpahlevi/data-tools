[project]
name = "data-tools"
version = "1.0.1"
description = "A collection of helper utilities for data analysis and data engineering workflows"
readme = "README.md"
authors = [
    { name = "Muhamad Reza Pahlevi", email = "mrpahlevi.work@gmail.com" }
]
requires-python = ">=3.9"
dependencies = ["pandas", "tqdm", "openpyxl"]

[project.scripts]
data-tools = "data_tools.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

license = "MIT"
license-files = ["LICENSE"]
